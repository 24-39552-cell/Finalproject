<!DOCTYPE html>

<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 72 72" aria-hidden="true">
        <circle cx="36" cy="36" r="34" fill="none" stroke="#10b981" stroke-width="3"/>
        <path d="M36 12 54 19v15c0 11-8 19-18 24-10-5-18-13-18-24V19z" fill="#10b981"/>

      <span>Attendance Portal</span>

    <nav id="nav" aria-label="Main"></nav>

<div id="toast" role="status" aria-live="polite"></div>

<script src="js/admin.js"></script>
